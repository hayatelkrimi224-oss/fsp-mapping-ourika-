<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#map {
    height: 100vh;
    width: 100%;
}

#panel {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 1000;
    width: 330px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.30);
}

#panel h2 {
    margin-top: 0;
    font-size: 20px;
}

.zone {
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 16px;
}

.agency {
    border-bottom: 1px solid #ddd;
    padding: 9px 0;
}

.agency-name {
    font-weight: bold;
    margin-bottom: 4px;
}

.agency a {
    display: inline-block;
    margin-top: 5px;
    padding: 6px 9px;
    background: #1976d2;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    font-size: 13px;
}

.agency a:hover {
    background: #125aa0;
}

</style>
</head>

/* =========================
   MAP
========================= */

const map = L.map("map").setView(
    [31.38, -7.80],
    13
);


/* =========================
   ESRI STREET MAP
========================= */

L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {
        maxZoom: 19,
        attribution:
        "Tiles © Esri | Sources: Esri, HERE, Garmin, USGS, Intermap, INCREMENT P, NRCan, Esri Japan, METI, Esri China (Hong Kong), Esri Korea, Esri (Thailand), NGCC, © OpenStreetMap contributors"
    }
).addTo(map);


/* =========================
   MARKERS
========================= */

const markers = [];


agencies.forEach(function(agency) {

    const marker = L.marker([
        agency.lat,
        agency.lng
    ]).addTo(map);


    marker.bindPopup(`
        <div style="min-width:180px">
            <h3 style="margin-bottom:5px">
                ${agency.name}
            </h3>

            <p>
                <strong>Zone:</strong>
                ${agency.zone}
            </p>

            <a href="${agency.url}"
               target="_blank"
               style="
               display:inline-block;
               padding:8px 12px;
               background:#1976d2;
               color:white;
               text-decoration:none;
               border-radius:5px;">
               📍 Ouvrir Google Maps
            </a>
        </div>
    `);

    markers.push(marker);
});


/* =========================
   LIST
========================= */

const list = document.getElementById("agencyList");

let currentZone = "";

agencies.forEach(function(agency) {

    if (agency.zone !== currentZone) {

        currentZone = agency.zone;

        const zoneTitle = document.createElement("div");

        zoneTitle.className = "zone";

        zoneTitle.innerHTML =
            "📍 " + agency.zone;

        list.appendChild(zoneTitle);
    }


    const item = document.createElement("div");

    item.className = "agency";

    item.innerHTML = `
        <div class="agency-name">
            ${agency.id}. ${agency.name}
        </div>

        <a href="${agency.url}"
           target="_blank">
           Ouvrir Google Maps
        </a>
    `;

    item.onclick = function() {

        map.setView(
            [agency.lat, agency.lng],
            16
        );

        markers[agency.id - 1].openPopup();

    };


    list.appendChild(item);

});

</script>
